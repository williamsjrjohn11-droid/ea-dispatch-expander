<style>
  :root{
    --bg:#0f1117; --panel:#1a1d27; --panel2:#22263a; --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
    --text:#f0f2f8; --text-dim:#aab0c4; --text3:#9096b0; --amber:#f5a623; --amber-dim:#3a2c0f;
    --green:#22c97a; --green-dim:#123324; --red:#f0524f; --blue:#4e8ef7;
    --mono:"SF Mono","Consolas",monospace; --sans:-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; padding:16px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .brandbar{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .brandbar img{width:56px; height:56px; object-fit:contain; flex-shrink:0;}
  header{margin-bottom:0;}
  .eyebrow{color:var(--amber); font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;}
  h1{font-size:20px; margin:4px 0 2px; font-weight:600;}
  .sub{color:var(--text-dim); font-size:13px; margin:0;}

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:16px; margin-bottom:14px;
  }
  label{display:block; font-size:12px; color:var(--text3); margin-bottom:6px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  textarea{
    width:100%; background:var(--panel2); border:1px solid var(--border2); border-radius:8px;
    color:var(--text); font-family:var(--mono); font-size:14px; padding:10px;
    min-height:110px; resize:vertical;
  }
  textarea:focus, input:focus{outline:2px solid var(--amber); outline-offset:1px;}
  button{
    -webkit-appearance:none; border:none; border-radius:8px; font-size:15px; font-weight:600;
    padding:13px 18px; cursor:pointer; width:100%; margin-top:10px;
  }
  .btn-primary{background:var(--amber); color:#1a1305;}
  .btn-primary:active{opacity:.85;}
  .btn-secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border2);}
  .btn-secondary:active{opacity:.85;}

  .review-banner{
    display:none; background:var(--amber-dim); border:1px solid var(--amber); color:var(--amber);
    border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px; font-weight:600;
  }
  .review-banner.show{display:block;}

  .field-grid{display:grid; grid-template-columns:1fr; gap:10px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field-label{font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.04em; font-weight:600; display:flex; justify-content:space-between; align-items:center;}
  .badge{font-size:10px; padding:2px 6px; border-radius:100px; font-weight:700; letter-spacing:.03em;}
  .badge-book{background:var(--green-dim); color:var(--green);}
  .badge-text{background:var(--panel2); color:var(--text-dim); border:1px solid var(--border2);}
  .badge-review{background:var(--amber-dim); color:var(--amber);}
  input[type=text]{
    width:100%; background:var(--panel2); border:1px solid var(--border2); border-radius:8px;
    color:var(--text); font-family:var(--mono); font-size:14px; padding:9px 10px;
  }
  input.needs-review{border-color:var(--amber);}

  .output-panel{border-color:var(--green);}
  #output{
    white-space:pre-wrap; font-family:var(--mono); font-size:14px; line-height:1.55;
    background:var(--panel2); border:1px solid var(--border2); border-radius:8px; padding:12px;
    min-height:160px;
  }
  .copied-flag{
    display:none; text-align:center; font-size:12px; color:var(--green); margin-top:8px; font-weight:600;
  }
  .copied-flag.show{display:block;}
  .empty-hint{color:var(--text-dim); font-size:13px; text-align:center; padding:20px 0;}
</style>
</head>

NT", "Destination Address": "14700 W. Hwy 80 Forney, TX 75126"}, {"Shipping Station": "ROYSE CITY YARD CRUSHED STONE", "Shipping Address": "2200 EAST COUNTY LINE ROAD, ROYSE CITY, TX 75189", "Amrize RMX Plant Name": "DOWNTOWN DALLAS READY MIX PLANT", "Destination Address": "1005 Forest Ave, Dallas, TX 75215"}, {"Shipping Station": "ROYSE CITY YARD CRUSHED STONE", "Shipping Address": "2200 EAST COUNTY LINE ROAD, ROYSE CITY, TX 75189", "Amrize RMX Plant Name": "ROCKWALL READY MIX PLANT", "Destination Address": "2640 State Hwy 276 Rockwall, TX 75087"}, {"Shipping Station": "ROYSE CITY YARD CRUSHED STONE", "Shipping Address": "2200 EAST COUNTY LINE ROAD, ROYSE CITY, TX 75189", "Amrize RMX Plant Name": "SOUTH DALLAS READY MIX PLANT", "Destination Address": "2861 S. Beltline Rd Dallas, TX 75253"}, {"Shipping Station": "ROYSE CITY YARD CRUSHED STONE", "Shipping Address": "2200 EAST COUNTY LINE ROAD, ROYSE CITY, TX 75189", "Amrize RMX Plant Name": "WYLIE READY MIX PLANT", "Destination Address": "10709 State Hwy 205 Lavon, TX 75166"}, {"Shipping Station": "ROYSE CITY YARD CRUSHED STONE", "Shipping Address": "2200 EAST COUNTY LINE ROAD, ROYSE CITY, TX 75189", "Amrize RMX Plant Name": "DALLAS READY MIX PLANT", "Destination Address": "10361 Bickham Dr, Dallas, TX 75220"}, {"Shipping Station": "ROYSE CITY YARD CRUSHED STONE", "Shipping Address": "2200 EAST COUNTY LINE ROAD, ROYSE CITY, TX 75189", "Amrize RMX Plant Name": "PLANO READY MIX PLANT", "Destination Address": "1200 Avenue N, Plano, TX 75074"}];

function normalize(str){
  return (str || '').toUpperCase().replace(/[.,#"'’”″′]/g,'').replace(/\s+/g,' ').trim();
}

function matchLocation(text){
  const norm = normalize(text);
  const words = norm.split(' ').filter(w => w.length > 2);
  let best = null, bestScore = 0;
  ADDRESS_BOOK.forEach(row => {
    [
      {name: row['Shipping Station'], address: row['Shipping Address']},
      {name: row['Amrize RMX Plant Name'], address: row['Destination Address']}
    ].forEach(cand => {
      const candNorm = normalize(cand.name);
      let score = 0;
      words.forEach(w => { if(candNorm.includes(w)) score++; });
      if(score > bestScore){
        bestScore = score;
        best = {station: cand.name.trim(), address: cand.address, confidence: score / Math.max(words.length,1)};
      }
    });
  });
  if(!best || bestScore === 0) return {matched:false, station:null, address:null, confidence:0};
  return {matched:true, ...best};
}

function extractDate(text){
  const m = text.match(/([A-Za-z]+day)?\s*(\d{1,2}\/\d{1,2}\/\d{2,4})/);
  return m ? {dayName:m[1]||'', date:m[2]} : {dayName:'', date:''};
}
function extractTime(text){
  const m = text.match(/(\d{1,2}(:\d{2})?\s?(am|pm|AM|PM))/);
  return m ? m[1].replace(/\s+/g,'') : '';
}
function explicitAddress(raw){
  if(!raw) return null;
  const m = raw.match(/\d{1,6}\s+[A-Za-z0-9.\s]+,\s*[A-Za-z\s]+,?\s*TX\s*\d{5}/i);
  return m ? m[0].trim() : null;
}

function parseStructured(text){
  const get = (label) => {
    const re = new RegExp(label + '\\s*-+\\s*(.+)', 'i');
    const m = text.match(re);
    return m ? m[1].split('\n')[0].trim() : '';
  };
  const {dayName, date} = extractDate(text);
  return {
    quantity: get('Quantity'),
    product: get('Product'),
    pickupRaw: get('Pickup'),
    deliveryRaw: get('Delivery'),
    dayName, date,
    time: extractTime(text)
  };
}

function parseTerse(text){
  // Accepts straight quotes ("Melissa) and curly/smart quotes (”Melissa) alike
  const m = text.match(/(\d+)\s+([\d\/.]+["'’”″′])\s+(.+?)\s+to\s+(.+?)\s+(\d{1,2}(:\d{2})?\s?(am|pm))/i);
  const {dayName, date} = extractDate(text);
  if(!m) return {quantity:'', product:'', pickupRaw:'', deliveryRaw:'', dayName, date, time:''};
  return {
    quantity: m[1], product: m[2].trim(), pickupRaw: m[3].trim(), deliveryRaw: m[4].trim(),
    time: m[5].replace(/\s+/g,''), dayName, date
  };
}

let currentFields = null;

function runParse(){
  const text = document.getElementById('raw').value;
  if(!text.trim()) return;
  const isStructured = /pickup\s*-|delivery\s*-|quantity\s*-/i.test(text);
  const base = isStructured ? parseStructured(text) : parseTerse(text);

  const pickupExplicit = explicitAddress(base.pickupRaw);
  const deliveryExplicit = explicitAddress(base.deliveryRaw);
  const pickupMatch = base.pickupRaw ? matchLocation(base.pickupRaw) : {matched:false};
  const deliveryMatch = base.deliveryRaw ? matchLocation(base.deliveryRaw) : {matched:false};

  currentFields = {
    quantity: base.quantity || '',
    product: base.product || '',
    dayName: base.dayName || '',
    date: base.date || '',
    time: base.time || '',
    pickupStation: pickupExplicit ? (base.pickupRaw || '') : (pickupMatch.station || base.pickupRaw || ''),
    pickupAddress: pickupExplicit || pickupMatch.address || '',
    pickupSource: pickupExplicit ? 'explicit' : (pickupMatch.matched ? 'book' : 'none'),
    pickupConfidence: pickupExplicit ? 1 : (pickupMatch.confidence || 0),
    deliveryStation: deliveryExplicit ? (base.deliveryRaw || '') : (deliveryMatch.station || base.deliveryRaw || ''),
    deliveryAddress: deliveryExplicit || deliveryMatch.address || '',
    deliverySource: deliveryExplicit ? 'explicit' : (deliveryMatch.matched ? 'book' : 'none'),
    deliveryConfidence: deliveryExplicit ? 1 : (deliveryMatch.confidence || 0),
    notes: /thumbs up|👍/i.test(text) ? 'Acknowledge with 👍' : ''
  };

  const openMatch = text.match(/site opens[^\n]*/i);
  if(openMatch) currentFields.siteOpens = openMatch[0].trim();

  renderFields();
  renderOutput();
}

function renderFields(){
  const f = currentFields;
  const grid = document.getElementById('fieldGrid');
  const needsReview = f.pickupConfidence < 0.5 || f.deliveryConfidence < 0.5;
  document.getElementById('reviewBanner').classList.toggle('show', needsReview);

  const rows = [
    ['quantity','Quantity', f.quantity, null],
    ['product','Product', f.product, null],
    ['pickupStation','Pickup site', f.pickupStation, f.pickupSource],
    ['pickupAddress','Pickup address', f.pickupAddress, f.pickupSource],
    ['deliveryStation','Delivery site', f.deliveryStation, f.deliverySource],
    ['deliveryAddress','Delivery address', f.deliveryAddress, f.deliverySource],
    ['time','Time', f.time, null],
    ['dayName','Day', f.dayName, null],
    ['date','Date', f.date, null]
  ];

  grid.innerHTML = rows.map(([key,label,val,source]) => {
    let badge = '';
    if(source === 'explicit') badge = '<span class="badge badge-text">from text</span>';
    else if(source === 'book') badge = '<span class="badge badge-book">from address book</span>';
    else if(source === 'none') badge = '<span class="badge badge-review">not matched</span>';
    const isLow = (key.startsWith('pickup') && f.pickupConfidence < 0.5) || (key.startsWith('delivery') && f.deliveryConfidence < 0.5);
    return `<div class="field">
      <div class="field-label"><span>${label}</span>${badge}</div>
      <input type="text" class="${isLow?'needs-review':''}" value="${(val||'').replace(/"/g,'&quot;')}"
        oninput="updateField('${key}', this.value)">
    </div>`;
  }).join('');

  document.getElementById('fieldsPanel').style.display = 'block';
}

function updateField(key, value){
  currentFields[key] = value;
  renderOutput();
}

function renderOutput(){
  const f = currentFields;
  const dateLine = [f.dayName, f.date].filter(Boolean).join(' ');
  const lines = [];
  lines.push('Please acknowledge all dispatches with a thumbs up 👍');
  if(dateLine) lines.push(dateLine);
  lines.push('');
  if(f.quantity) lines.push(`Quantity - ${f.quantity}`);
  if(f.product) lines.push(`Product - ${f.product}`);
  if(f.pickupStation || f.pickupAddress){
    lines.push(`Pickup - ${f.pickupStation}${f.pickupStation ? ' —' : ''}`);
    if(f.pickupAddress) lines.push(f.pickupAddress);
  }
  lines.push('');
  if(f.deliveryStation || f.deliveryAddress){
    lines.push(`Delivery - ${f.deliveryStation}${f.deliveryAddress ? '—' + f.deliveryAddress : ''}`);
  }
  lines.push('');
  if(f.siteOpens) lines.push(f.siteOpens);
  else if(f.time) lines.push(`Site opens ${f.time}`);

  document.getElementById('output').textContent = lines.join('\n');
  const needsReview = f.pickupConfidence < 0.5 || f.deliveryConfidence < 0.5;
  document.getElementById('outBadge').innerHTML = needsReview
    ? '<span class="badge badge-review">review before sending</span>'
    : '<span class="badge badge-book">ready</span>';
}

function copyOutput(){
  const text = document.getElementById('output').textContent;
  if(!text || text.includes('Paste a dispatch')) return;
  navigator.clipboard.writeText(text).then(() => {
    const flag = document.getElementById('copiedFlag');
    flag.classList.add('show');
    setTimeout(() => flag.classList.remove('show'), 1800);
  });
}

// Register service worker for offline/installable support (Android + iOS PWA).
// Safe no-op in browsers that don't support it (old iOS Safari < 11.3).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
